<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%">
  <defs>
    <!-- Modern Gradient Background -->
    <linearGradient id="bgGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Vibrant Link Gradient -->
    <linearGradient id="linkGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>

    <!-- Arrow Gradient -->
    <linearGradient id="arrowGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#fb7185" />
    </linearGradient>

    <!-- Drop Shadow for Depth -->
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Container Box with Rounded Corners -->
  <rect width="64" height="64" rx="16" fill="url(#bgGlow)" />

  <g filter="url(#dropShadow)">
    <!-- Left Link Loop -->
    <path d="M 23,24 L 19,24 C 14.58,24 11,27.58 11,32 C 11,36.42 14.58,40 19,40 L 23,40" 
          fill="none" 
          stroke="url(#linkGradient)" 
          stroke-width="5" 
          stroke-linecap="round" />

    <!-- Right Link Loop -->
    <path d="M 41,24 L 45,24 C 49.42,24 53,27.58 53,32 C 53,36.42 49.42,40 45,40 L 41,40" 
          fill="none" 
          stroke="url(#linkGradient)" 
          stroke-width="5" 
          stroke-linecap="round" />

    <!-- Left Compress Arrow (pointing right) -->
    <path d="M 22,32 L 28,32 M 26,28 L 29.5,32 L 26,36" 
          fill="none" 
          stroke="url(#arrowGradient)" 
          stroke-width="3.5" 
          stroke-linecap="round" 
          stroke-linejoin="round" />

    <!-- Right Compress Arrow (pointing left) -->
    <path d="M 42,32 L 36,32 M 38,28 L 34.5,32 L 38,36" 
          fill="none" 
          stroke="url(#arrowGradient)" 
          stroke-width="3.5" 
          stroke-linecap="round" 
          stroke-linejoin="round" />
  </g>
</svg>
